[wokwi]
version = 1

# MicroPython runs as the board's firmware. Your own .py files are not baked
# in: mpremote copies them onto the simulated board's filesystem while the
# simulation runs. See the "Run on Wokwi" task in .vscode/tasks.json.
firmware = "RPI_PICO-20260824-v1.29.0.uf2"
elf = "RPI_PICO-20260824-v1.29.0.uf2"

# mpremote talks to the board over this port.
rfc2217ServerPort = 4000
